<!DOCTYPE html>
<html>
<head><title>Logo Test</title></head>
<body style="background:#1a1a1a; padding: 40px;">
  <p style="color:white; font-family:sans-serif;">Plain img tag, no CSS class, explicit size:</p>
  <img src="frontend/static/img/logo-full.svg" style="height:100px; border:1px solid red;">

  <p style="color:white; font-family:sans-serif; margin-top:40px;">With the site's actual CSS rule (height:64px):</p>
  <img src="frontend/static/img/logo-full.svg" style="height:64px; width:auto; object-fit:contain; border:1px solid red;">

  <p style="color:white; font-family:sans-serif; margin-top:40px;">Inline SVG object tag (renders the file directly):</p>
  <object data="frontend/static/img/logo-full.svg" type="image/svg+xml" style="height:100px; border:1px solid red;"></object>
</body>
</html>
