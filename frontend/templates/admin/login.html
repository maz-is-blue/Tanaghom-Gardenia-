<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login · Tanaghom Gardenia Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;1,400&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',sans-serif;background:#0a0a0a;color:#fff;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.box{width:100%;max-width:380px}
.logo{text-align:center;margin-bottom:36px}
.logo h1{font-family:'Playfair Display',serif;font-size:28px;font-weight:400}
.logo h1 em{color:#F5D000;font-style:italic}
.logo p{font-size:10px;letter-spacing:.28em;text-transform:uppercase;color:#888;margin-top:8px}
.card{background:#111;border:1px solid rgba(255,255,255,.1);border-radius:4px;padding:32px}
.fg{display:flex;flex-direction:column;gap:8px;margin-bottom:20px}
.fg label{font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:#888;font-weight:600}
.fg input{background:#1a1a1a;border:1px solid rgba(255,255,255,.1);color:#fff;padding:13px 16px;border-radius:3px;font-size:15px;width:100%;transition:border-color .2s}
.fg input:focus{outline:none;border-color:#F5D000}
.btn{width:100%;padding:13px;background:#F5D000;color:#0a0a0a;border:none;border-radius:2px;font-size:11px;letter-spacing:.24em;text-transform:uppercase;font-weight:700;cursor:pointer;transition:opacity .2s}
.btn:hover{opacity:.85}
.err{background:rgba(192,57,43,.14);border:1px solid rgba(192,57,43,.3);color:#e74c3c;padding:12px 16px;border-radius:3px;font-size:13px;margin-bottom:18px}
.back{text-align:center;margin-top:20px;font-size:12px;color:#888}
.back a{color:#F5D000}
</style>
</head>
<body>
<div class="box">
  <div class="logo">
    <h1>Tanaghom <em>·</em> Gardenia</h1>
    <p>Content Dashboard</p>
  </div>
  {% with messages = get_flashed_messages(with_categories=true) %}
    {% if messages %}{% for cat, msg in messages %}
      <div class="err">{{ msg }}</div>
    {% endfor %}{% endif %}
  {% endwith %}
  <div class="card">
    <form method="POST">
      <div class="fg">
        <label>Password</label>
        <input type="password" name="password" autofocus placeholder="Enter admin password">
      </div>
      <button type="submit" class="btn">Sign In</button>
    </form>
  </div>
  <div class="back"><a href="/">← Back to website</a></div>
</div>
</body>
</html>
